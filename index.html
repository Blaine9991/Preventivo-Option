<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Calcolatore Asciugapassi 2025 - FLOORMAD</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #f4f7f6; padding: 20px; color: #333; }
        .container { max-width: 1000px; background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); margin: auto; }
        .header { border-bottom: 3px solid #0056b3; margin-bottom: 20px; padding-bottom: 10px; }
        .inputs { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; background: #f8f9fa; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        label { font-weight: bold; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 16px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #e0e0e0; padding: 12px; text-align: center; }
        th { background-color: #0056b3; color: white; font-size: 0.9em; }
        .base-val { background-color: #fff9c4; font-weight: bold; }
        .markup-val { background-color: #e3f2fd; font-weight: bold; color: #1565c0; }
        .fixed-cost { color: #666; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>Listino ZERB ASCIUGA ALLU - 2025</h2>
    </div>
    
    <div class="inputs">
        <div>
            <label>LARGHEZZA (CM) [E4]</label>
            <input type="number" id="dimE4" value="80" oninput="runCalc()">
        </div>
        <div>
            <label>LUNGHEZZA (CM) [G4]</label>
            <input type="number" id="dimG4" value="50" oninput="runCalc()">
        </div>
    </div>

    <table>
        <thead>
            <tr>
                <th>DESCRIZIONE</th>
                <th>MQ</th>
                <th>€/MQ</th>
                <th>VALORE MQ</th>
                <th>TRASPORTO</th>
                <th>LOGO</th>
                <th>€/PEZZO (I8/I9)</th>
                <th>RIC. +30%/+40% (J)</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td style="text-align:left">Qualità Stampa Standard 50dpi</td>
                <td id="mq_val">0.40</td>
                <td>76.00</td>
                <td id="val_mq_std">30.40</td>
                <td class="fixed-cost">20.00</td>
                <td class="fixed-cost">3.00</td>
                <td class="base-val">€ <span id="total_std">53.40</span></td>
                <td class="markup-val">€ <span id="ric_std">97.19</span></td>
            </tr>
            <tr>
                <td style="text-align:left">Fuori Standard (+25%)</td>
                <td id="mq_val_fs">0.40</td>
                <td>95.00</td>
                <td id="val_mq_fs">38.00</td>
                <td class="fixed-cost">20.00</td>
                <td class="fixed-cost">3.00</td>
                <td class="base-val">€ <span id="total_fs">61.00</span></td>
                <td class="markup-val">€ <span id="ric_fs">111.02</span></td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    function runCalc() {
        const e4 = parseFloat(document.getElementById('dimE4').value) || 0;
        const g4 = parseFloat(document.getElementById('dimG4').value) || 0;
        
        const mq = (e4 * g4) / 10000;
        const trasporto = 20.00;
        const logo = 3.00;
        const coeff = 1.82;

        // Calcoli Standard
        const valMqStd = mq * 76.00;
        const totalI8 = valMqStd + trasporto + logo;
        const totalJ8 = totalI8 * coeff;

        // Calcoli Fuori Standard
        const valMqFS = mq * 95.00;
        const totalI9 = valMqFS + trasporto + logo;
        const totalJ9 = totalI9 * coeff;

        // Aggiornamento UI
        document.getElementById('mq_val').innerText = mq.toFixed(2);
        document.getElementById('mq_val_fs').innerText = mq.toFixed(2);
        document.getElementById('val_mq_std').innerText = valMqStd.toFixed(2);
        document.getElementById('val_mq_fs').innerText = valMqFS.toFixed(2);
        
        document.getElementById('total_std').innerText = totalI8.toFixed(2);
        document.getElementById('total_fs').innerText = totalI9.toFixed(2);
        
        document.getElementById('ric_std').innerText = totalJ8.toFixed(2);
        document.getElementById('ric_fs').innerText = totalJ9.toFixed(2);
    }
    window.onload = runCalc;
</script>

</body>
</html>
