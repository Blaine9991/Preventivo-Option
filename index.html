<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Preventivatore ASCIUGAPASSI</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        
        /* BOX INPUT SUPERIORE */
        .sezione-misure { margin-bottom: 50px; display: flex; align-items: center; }
        .freccia-box { background: #333; color: #ffcc00; padding: 15px 30px; font-weight: bold; font-size: 18px; text-align: center; margin-right: 20px; }
        .tabella-misure { border-collapse: collapse; border: 2px solid #000; }
        .tabella-misure td { border: 1px solid #000; padding: 5px; text-align: center; width: 120px; }
        .head-cm { background: #ffc000; font-weight: bold; }
        .input-misura { background: #ffff00; }
        .input-misura input { width: 100%; border: none; background: transparent; text-align: center; font-size: 20px; font-weight: bold; outline: none; }

        #testo-stato { margin-left: 20px; font-size: 22px; font-weight: bold; }

        /* TABELLA - BIANCA DI DEFAULT */
        .main-table { border-collapse: collapse; width: 100%; border: 1px solid #000; }
        .main-table th, .main-table td { border: 1px solid #000; padding: 12px; text-align: center; background-color: #ffffff; }
        
        /* INTESTAZIONE */
        .header-option { background: #000 !important; color: #ffff00 !important; font-weight: bold; font-size: 24px; width: 40%; }
        .header-grey { background: #d9d9d9 !important; font-weight: bold; }
        .header-prz-vendita { background: #76933c !important; color: white !important; font-weight: bold; }

        /* FORMATTAZIONE CONDIZIONALE */
        .verde-standard td { background-color: #90EE90 !important; }
        .arancio-fuori-standard td { background-color: #FFCC99 !important; }

        input.readonly-input { border: none; background: transparent; text-align: center; width: 100%; font-size: 16px; pointer-events: none; outline: none; font-weight: bold; }
    </style>
</head>
<body>

    <div class="sezione-misure">
        <div class="freccia-box">IMPOSTA MISURA<br>PERSONALIZZATA</div>
        <table class="tabella-misure">
            <tr><td colspan="2" class="head-cm">misura in CM</td></tr>
            <tr>
                <td class="input-misura"><input type="number" id="m-base" value="0" oninput="aggiornaTutto()"></td>
                <td class="input-misura"><input type="number" id="m-altezza" value="0" oninput="aggiornaTutto()"></td>
            </tr>
        </table>
        <div id="testo-stato"></div>
    </div>

    <table class="main-table">
        <thead>
            <tr>
                <th class="header-option">OPTION</th>
                <th class="header-grey">€/mq</th>
                <th class="header-prz-vendita">PRZ. VENDITA</th>
            </tr>
        </thead>
        <tbody id="corpo-tabella">
            <tr id="riga1">
                <td style="text-align:left; font-size:14px;">con 1 lato 50-60-75-85-100-115-150-200</td>
                <td>€ <span class="res-mq">0.00</span></td>
                <td>€ <span class="res-finale" style="font-weight:bold; font-size: 1.2em;">0.00</span></td>
            </tr>
            <tr id="riga2">
                <td style="text-align:left; font-size:14px;">fuori standard (prezzo +25%)</td>
                <td>€ <span class="res-mq">0.00</span></td>
                <td>€ <span class="res-finale" style="font-weight:bold; font-size: 1.2em;">0.00</span></td>
            </tr>
        </tbody>
    </table>

    <script>
        const misureStandard = [50, 60, 75, 85, 100, 115, 150, 200];
        const COSTO_TRASPORTO = 20;
        const COSTO_LOGO = 3;

        function aggiornaTutto() {
            const b = parseFloat(document.getElementById("m-base").value) || 0;
            const h = parseFloat(document.getElementById("m-altezza").value) || 0;
            const testoStato = document.getElementById("testo-stato");
            
            const r1 = document.getElementById("riga1");
            const r2 = document.getElementById("riga2");

            r1.className = "";
            r2.className = "";
            testoStato.innerText = "";

            if (b === 0 && h === 0) {
                document.querySelectorAll(".res-mq, .res-finale").forEach(el => el.innerText = "0.00");
                return;
            }

            const unoStandard = misureStandard.includes(b) || misureStandard.includes(h);
            const eccede200 = b > 200 || h > 200;

            if (unoStandard && !eccede200) {
                r1.className = "verde-standard";
                testoStato.innerText = "MISURA STANDARD";
                testoStato.style.color = "#28a745";
            } else {
                r2.className = "arancio-fuori-standard";
                testoStato.innerText = "MISURA NON STANDARD";
                testoStato.style.color = "#e67e22";
            }

            [r1, r2].forEach((riga, index) => {
                let pMq = (index === 0) ? 76 : (76 * 1.25);
                let mqArea = (b * h) / 10000;
                let totMq = mqArea * pMq;
                
                // Calcolo interno: (Prezzo MQ + Trasporto + Logo) * 1.3 * 1.4
                let pPezzo = totMq + COSTO_TRASPORTO + COSTO_LOGO;
                let finale = pPezzo * 1.3 * 1.4;

                riga.querySelector(".res-mq").innerText = totMq.toFixed(2);
                riga.querySelector(".res-finale").innerText = finale.toFixed(2);
            });
        }

        window.onload = aggiornaTutto;
    </script>
</body>
</html>
